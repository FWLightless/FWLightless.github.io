<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Portfolio & Resource Hub</title>
  <meta name="description" content="Personal Portfolio, Career Timeline, and Game Resource Center">
  
  <!-- Open Graph & Social Cards -->
  <meta property="og:title" content="Developer Portfolio & Resource Hub">
  <meta property="og:description" content="Explore my engineering projects, career journey, and game development resources.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/og-cover.webp">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 置顶导航栏 -->
  <header class="header-nav">
    <div class="container nav-container">
      <a href="#hero" class="nav-brand" id="nav-logo">DevHub.</a>
      <nav aria-label="Main Navigation">
        <ul class="nav-menu" id="nav-menu">
          <li><a href="#hero" class="nav-link active" data-i18n="nav.home">首页</a></li>
          <li><a href="#portfolio" class="nav-link" data-i18n="nav.portfolio">作品集</a></li>
          <li><a href="#timeline" class="nav-link" data-i18n="nav.timeline">经历</a></li>
          <li><a href="#skills" class="nav-link" data-i18n="nav.skills">技能树</a></li>
          <li><a href="#resources" class="nav-link" data-i18n="nav.resources">资源区</a></li>
          <li><a href="#contact" class="nav-link" data-i18n="nav.contact">联系</a></li>
        </ul>
      </nav>
      <div class="nav-controls">
        <button id="lang-toggle" class="btn-control" aria-label="Toggle Language">EN</button>
        <button id="theme-toggle" class="btn-control" aria-label="Toggle Dark Mode">🌙</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Hero 简介模块 -->
    <section id="hero" class="hero-section">
      <div class="container hero-grid">
        <div class="hero-content">
          <h1 class="hero-title" id="hero-title">构建高可用系统与<br><span>卓越数字体验</span></h1>
          <p class="hero-subtitle" id="hero-subtitle">全栈工程师 / 游戏开发者 / 开源贡献者</p>
          <div style="display: flex; gap: 1rem;">
            <a href="#portfolio" class="btn-control" style="background: var(--accent-color); color: #fff; border: none; padding: 0.8rem 1.5rem; text-decoration: none;" data-i18n="hero.cta_work">浏览作品</a>
            <a href="#contact" class="btn-control" style="padding: 0.8rem 1.5rem; text-decoration: none;" data-i18n="hero.cta_contact">取得联系</a>
          </div>
        </div>
        <div class="hero-avatar" style="text-align: center;">
          <img src="assets/images/avatar.webp" alt="Developer Portrait" width="280" height="280" style="border-radius: 50%; border: 4px solid var(--accent-color); object-fit: cover;" loading="eager">
        </div>
      </div>
    </section>

    <!-- 作品集模块 -->
    <section id="portfolio" class="container">
      <h2 class="section-title" data-i18n="portfolio.title">精选作品集</h2>
      <div class="grid-cards" id="portfolio-container">
        <!-- 由 render.js 动态注入 -->
      </div>
    </section>

    <!-- 经历时间轴模块 -->
    <section id="timeline" class="container">
      <h2 class="section-title" data-i18n="timeline.title">职业与教育经历</h2>
      <div class="timeline" id="timeline-container">
        <!-- 由 render.js 动态注入 -->
      </div>
    </section>

    <!-- 技能树模块 -->
    <section id="skills" class="container">
      <h2 class="section-title" data-i18n="skills.title">核心技能树</h2>
      <div class="grid-cards" id="skills-container" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
        <!-- 由 render.js 动态注入 -->
      </div>
    </section>

    <!-- 游戏与开发资源区 -->
    <section id="resources" class="container">
      <h2 class="section-title" data-i18n="resources.title">游戏资源与开发工具</h2>
      <div class="grid-cards" id="resources-container">
        <!-- 由 render.js 动态注入 -->
      </div>
    </section>
  </main>

  <!-- 联系方式模块 / 页脚 -->
  <footer id="contact" style="background: var(--bg-secondary); border-top: 1px solid var(--border-color); padding: 4rem 0 2rem 0;">
    <div class="container" style="text-align: center;">
      <h2 style="font-size: var(--step-2); margin-bottom: 1rem;" data-i18n="contact.title">保持联系</h2>
      <p style="color: var(--text-secondary); margin-bottom: 2rem;" data-i18n="contact.desc">无论是项目合作、技术交流还是游戏开发探讨，欢迎随时通过以下方式与我取得联系。</p>
      <div style="display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2rem;">
        <a href="mailto:alex@example.com" class="btn-control" style="text-decoration: none;">Email</a>
        <a href="https://github.com" target="_blank" rel="noopener" class="btn-control" style="text-decoration: none;">GitHub</a>
        <a href="https://twitter.com" target="_blank" rel="noopener" class="btn-control" style="text-decoration: none;">Twitter</a>
      </div>
      <p style="font-size: var(--step--1); color: var(--text-secondary);">&copy; 2025 DevHub. All rights reserved.</p>
    </div>
  </footer>

  <!-- 动态通用模态框 Component -->
  <div class="modal-overlay" id="global-modal" aria-hidden="true">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modal-title">Modal Title</h3>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body-content">
        <!-- 模态框内容由 JS 动态插入 -->
      </div>
    </div>
  </div>

  <script src="render.js"></script>
</body>
</html>
